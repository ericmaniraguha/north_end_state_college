<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programmes | North End College, Lusaka</title>
  <meta name="description" content="Full-time diploma programmes at North End College, Lusaka: business, finance, human resources, education, social work, public administration, journalism and public relations.">
  <meta name="theme-color" content="#005B2E">
  <meta property="og:site_name" content="North End College">
  <meta property="og:title" content="Programmes | North End College">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>Programmes</span></nav>
        <h1>Our Programmes</h1>
        <p>Full-time diploma programmes for the January 2027 intake, with descriptions and entry requirements.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters">
          <label>School
            <select id="filter-school">
              <option value="">All schools</option>
            </select>
          </label>
          <label>Search
            <input id="filter-search" type="search" placeholder="e.g. teaching, accounting">
          </label>
        </div>
        <p id="programme-count" class="result-count" aria-live="polite"></p>
        <div id="programme-grid" class="programme-grid">
          <p class="muted">Loading programmes…</p>
        </div>
      </div>
    </section>

    <section class="cta-band">
      <div class="container cta-inner">
        <div>
          <p class="eyebrow">Need help choosing?</p>
          <h2>Talk to our admissions team</h2>
          <p>Call or WhatsApp: <span data-phones></span></p>
        </div>
        <div class="cta-actions">
          <a href="/admissions#apply" class="btn btn-primary">Apply online</a>
          <a href="/admissions#requirements" class="btn btn-outline-dark">Entry requirements</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/site.js"></script>
  <script src="/js/programmes.js"></script>
</body>
</html>
