<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Dashboard | North End College</title>
  <meta name="theme-color" content="#005B2E">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">

  <div id="login-screen" class="login-screen">
    <form id="login" class="login-card form" novalidate>
      <div class="login-brand">
        <img src="/img/logo.svg" alt="" width="56" height="56">
        <span><strong>North End College</strong><small>Admin dashboard</small></span>
      </div>
      <h1>Sign in</h1>
      <p>Enter the admin token from the server's <code>.env</code> file.</p>
      <label>Admin token
        <input name="token" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>

  <div id="app" class="admin-app" hidden>
    <aside id="sidebar" class="admin-sidebar" aria-label="Dashboard">
      <a href="/" class="sidebar-brand" target="_blank" rel="noopener">
        <img src="/img/logo.svg" alt="" width="44" height="44">
        <span><strong>North End College</strong><small>Admin dashboard</small></span>
      </a>
      <div class="sidebar-status"><span class="live-dot"></span><span id="intake-status"></span></div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <a class="side-link" href="/" target="_blank" rel="noopener"><span data-admin-icon="external"></span>View website</a>
        <button class="side-link" id="logout" type="button"><span data-admin-icon="logout"></span>Log out</button>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><span data-admin-icon="menu"></span></button>
        <div class="topbar-title">
          <span>Admin</span>
          <h1 id="page-title">Applications</h1>
        </div>
        <label class="search-box global">
          <span data-admin-icon="search"></span>
          <input id="global-search" type="search" placeholder="Search applicants, NRC, phone…" aria-label="Search applications">
          <kbd id="search-shortcut">Ctrl K</kbd>
        </label>
        <div class="notify">
          <button id="bell" class="icon-btn" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notify-panel">
            <span data-admin-icon="bell"></span>
            <span id="bell-count" class="badge-dot" hidden></span>
          </button>
          <div id="notify-panel" class="notify-panel" hidden></div>
        </div>
      </header>

      <main id="view" class="admin-view" aria-live="polite"></main>
    </div>
  </div>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-name"></dialog>
  <dialog id="modal" class="modal" aria-label="New application"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/js/site.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
